            backdrop-filter: blur(10px);

        .navbar-container {

        }

            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.35);
        }

        .container {

            margin: 40px auto;

            padding: 40px 30px;

        .profile-img-container {

            padding: 5px;
            border-radius: 50%;

        .profile-img-container:hover { transform: scale(1.05) rotate(3deg); }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: white; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; text-align: left; }
        @media (max-width: 500px) { .info-grid { grid-template-columns: 1fr; } }
        .info-card { background: #f7fafc; padding: 15px 20px; border-radius: 16px; border-left: 4px solid #3182ce; }
        .info-card h3 { margin: 0; font-size: 16px; color: #a0aec0; font-weight: 400; }
        .info-card p { margin: 5px 0 0 0; font-size: 18px; color: #2d3748; font-weight: 600; }
        .info-card-full { grid-column: span 2; }
        @media (max-width: 500px) { .info-card-full { grid-column: span 1; } }

        .fb-btn {

            padding: 14px 40px;

            color: white;
            background: linear-gradient(135deg, #1877f2, #0a52b7);
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.4);
            transition: all 0.3s ease;
